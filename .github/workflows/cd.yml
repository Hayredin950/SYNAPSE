name: CD — Build, Push & Deploy

# ============================================================
# SYNAPSE Continuous Deployment Pipeline
# ============================================================
# Triggers: push to main + manual dispatch
#
# Flow:
#   1. Build Docker images (amd64 by default — see PLATFORMS below)
#   2. Push to GitHub Container Registry (GHCR) with SHA + latest tags
#   3. If a deploy target is configured: SSH to the host, pull, migrate, reload
#   4. Health check the production URL
#   5. Notify (Slack / GitHub deployment status)
#
# The deploy job is SKIPPED unless the repository variable
# DEPLOY_ENABLED is set to "true". Until then this workflow only builds and
# publishes images, which is safe to run with no infrastructure.
#
# To enable deploys:
#   Settings → Secrets and variables → Actions
#     Variables: DEPLOY_ENABLED = true
#                PRODUCTION_URL  (public URL — a variable, NOT a secret)
#                BUILD_PLATFORMS = linux/amd64,linux/arm64   (ARM hosts only)
#     Secrets:   SSH_HOST, SSH_USER, SSH_KEY
#                SSH_PORT           (optional, defaults to 22)
#                NEXT_PUBLIC_API_URL (baked into the frontend image at build)
#                SLACK_WEBHOOK_URL  (optional)
#
# The host must have /opt/synapse containing docker-compose.prod.yml,
# infrastructure/, and a populated .env.prod.
# ============================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel in-flight deploys

env:
  REGISTRY: ghcr.io
  # Building arm64 on an amd64 runner goes through QEMU emulation. For this
  # image set (torch, scientific wheels) that can run for hours and hit the
  # 6-hour job ceiling, so amd64 is the default. Set the repository variable
  # BUILD_PLATFORMS to "linux/amd64,linux/arm64" only when deploying to an
  # ARM host such as an Oracle Ampere instance.
  PLATFORMS: ${{ vars.BUILD_PLATFORMS || 'linux/amd64' }}

jobs:
  # ── Build & push images ───────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents:  read
      packages:  write
      id-token:  write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      owner_lc:  ${{ steps.owner.outputs.lowercase }}

    steps:
      - uses: actions/checkout@v4

      # Docker image references must be lowercase, but a GitHub owner may
      # contain capitals (this one does: Hayredin950). Using
      # github.repository_owner verbatim fails the push with
      # "invalid reference format".
      - name: Lowercase image owner
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image metadata ──────────────────────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-backend
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-frontend
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-ai-engine
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Backend ─────────────────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    backend/Dockerfile
          target:  production
          platforms: ${{ env.PLATFORMS }}
          push:    true
          tags:    ${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-backend:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-backend:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          labels:  ${{ steps.meta.outputs.labels }}

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file:    frontend/Dockerfile
          target:  production
          platforms: ${{ env.PLATFORMS }}
          push:    true
          tags:    ${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-frontend:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          labels:  ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

      # ── AI Engine ────────────────────────────────────────────────────────
      - name: Build & push AI engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    ai_engine/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push:    true
          tags:    ${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-ai-engine:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.owner.outputs.lowercase }}/synapse-ai-engine:latest
          cache-from: type=gha,scope=ai-engine
          cache-to:   type=gha,scope=ai-engine,mode=max
          labels:  ${{ steps.meta.outputs.labels }}

  # ── Deploy to a host over SSH ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    # Skipped unless a deploy target is configured. Without this the job fails
    # on every push for anyone who has not set up a host, and a permanently red
    # pipeline is one nobody reads. Images are still built and pushed above, so
    # a manual `docker compose pull` on the host remains possible.
    if: vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      # Must be a variable, not a secret. GitHub does not expose the `secrets`
      # context in `environment.url`, and using it there is a hard parse error
      # that stops the WHOLE workflow from loading — every run fails in 0s with
      # no jobs created. A public URL is not secret, so PRODUCTION_URL lives in
      # repository variables.
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy configuration
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ]  || missing="$missing SSH_HOST(secret)"
          [ -n "${{ secrets.SSH_USER }}" ]  || missing="$missing SSH_USER(secret)"
          [ -n "${{ secrets.SSH_KEY }}" ]   || missing="$missing SSH_KEY(secret)"
          [ -n "${{ vars.PRODUCTION_URL }}" ] || missing="$missing PRODUCTION_URL(variable)"
          if [ -n "$missing" ]; then
            echo "DEPLOY_ENABLED is true but these are unset:$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required deploy configuration present."

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token:       ${{ secrets.GITHUB_TOKEN }}
          environment: production

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          timeout:  300s
          script: |
            set -e
            cd /opt/synapse

            echo "=== Pulling latest images ==="
            export IMAGE_TAG=${{ github.sha }}
            # docker-compose.prod.yml builds image names as
            #   ghcr.io/$IMAGE_OWNER/synapse-<component>:$IMAGE_TAG
            # which must match exactly what build-push published above.
            export IMAGE_OWNER=${{ needs.build-push.outputs.owner_lc }}
            docker compose -f docker-compose.prod.yml pull

            echo "=== Running database migrations ==="
            docker compose -f docker-compose.prod.yml run --rm backend \
              python manage.py migrate --noinput

            echo "=== Collecting static files ==="
            docker compose -f docker-compose.prod.yml run --rm backend \
              python manage.py collectstatic --noinput

            echo "=== Rolling restart (zero downtime) ==="
            docker compose -f docker-compose.prod.yml up -d \
              --remove-orphans \
              --no-deps \
              backend fastapi_ai frontend celery_worker celery_beat flower

            echo "=== Pruning old images ==="
            docker image prune -f --filter "until=72h"

            echo "=== Deploy complete ==="

      - name: Production health check
        run: |
          echo "Waiting 30s for services to stabilise..."
          sleep 30
          for i in 1 2 3 4 5; do
            if curl -sf ${{ vars.PRODUCTION_URL }}/api/v1/health/; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts!"
          exit 1

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token:         ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state:         success
          environment-url: ${{ vars.PRODUCTION_URL }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token:         ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state:         failure

      - name: Notify Slack — success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,took
          text: "✅ SYNAPSE deployed to production — <${{ vars.PRODUCTION_URL }}|view live>"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack — failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,took
          text: "🚨 SYNAPSE deploy FAILED — check <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
