[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | migrations
  | .git
  | .venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_django = ["django", "rest_framework", "celery"]
known_first_party = ["config", "core", "users", "articles", "repositories", "papers", "videos", "automation", "agents", "documents", "trends"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = [
    "B101",  # assert used as a defensive check in non-test code
    "B601",  # paramiko shell invocations are constructed from fixed commands
    "B105",  # false positives: OAuth endpoint URLs / validation strings
    "B110",  # try/except/pass — deliberate non-fatal fallbacks (analytics, email, …)
    "B112",  # try/except/continue — font-fallback loops
    "B404",  # subprocess import — deliberate; calls use explicit argv lists
    "B603",  # subprocess without shell=True — no shell interpolation
    "B607",  # pg_dump invoked from PATH in the backup task
    "B405",  # xml.etree import — fromstring sites are nosec'd (trusted feeds)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests (>5s)",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/*",
    "*/__pycache__/*",
    "*/settings/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
